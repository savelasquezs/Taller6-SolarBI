apiVersion: 1
groups:
- orgId: 1
  name: solarbi
  folder: SolarBI
  interval: 10s
  rules:
  - uid: soc-bajo
    title: 'DEMO: SoC bajo'
    condition: C
    for: ${SOC_ALERT_SECONDS}s
    noDataState: OK
    execErrState: Error
    annotations:
      summary: Umbral académico demostrativo; mediciones históricas reproducidas,
        no telemetría actual.
    labels:
      proyecto: solarbi
    data:
    - refId: A
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: solarbi-pg
      model:
        refId: A
        datasource:
          type: grafana-postgresql-datasource
          uid: solarbi-pg
        format: table
        rawSql: SELECT u.soc-${SOC_ALERT_THRESHOLD} AS value,u.inversor::text AS inversor FROM
          demo.ultima u WHERE u.emitido>now()-interval
          '${STALE_SECONDS} seconds'
        editorMode: code
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: lt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - C
          reducer:
            type: last
            params: []
          type: query
  - uid: sin-lecturas
    title: 'DEMO: sin lecturas recientes'
    condition: C
    for: 0s
    noDataState: Alerting
    execErrState: Error
    annotations:
      summary: Umbral académico demostrativo; mediciones históricas reproducidas,
        no telemetría actual.
    labels:
      proyecto: solarbi
    data:
    - refId: A
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: solarbi-pg
      model:
        refId: A
        datasource:
          type: grafana-postgresql-datasource
          uid: solarbi-pg
        format: table
        rawSql: SELECT coalesce(extract(epoch FROM now()-u.emitido),999)-${STALE_SECONDS} AS value,i.inversor::text
          AS inversor FROM gold.dim_inversor i LEFT JOIN demo.ultima u USING(inversor)
          WHERE i.inversor>0
        editorMode: code
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - C
          reducer:
            type: last
            params: []
          type: query
