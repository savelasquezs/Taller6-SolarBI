apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: solarbi
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: solarbi-grafana
  template:
    metadata:
      labels:
        app: solarbi-grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:13.2.3
          envFrom:
            - configMapRef: {name: solarbi-config}
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: {name: solarbi-credenciales, key: GRAFANA_PASSWORD}
            - name: BI_PASSWORD
              valueFrom:
                secretKeyRef: {name: solarbi-credenciales, key: BI_PASSWORD}
            - {name: GF_USERS_ALLOW_SIGN_UP, value: 'false'}
            - {name: GF_AUTH_ANONYMOUS_ENABLED, value: 'false'}
            - {name: GF_ANALYTICS_REPORTING_ENABLED, value: 'false'}
            - {name: GF_PLUGINS_PREINSTALL_SYNC, value: 'grafana-postgresql-datasource@13.0.7'}
            - {name: GF_PLUGINS_PREINSTALL_AUTO_UPDATE, value: 'false'}
            - name: GF_PLUGINS_DISABLE_PLUGINS
              value: grafana-lokiexplore-app,grafana-pyroscope-app,grafana-exploretraces-app,grafana-metricsdrilldown-app,elasticsearch,prometheus,tempo,zipkin,opentsdb,stackdriver,mssql,jaeger,loki,mysql,influxdb,grafana-advisor-app,grafana-pyroscope-datasource
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: '1', memory: 768Mi}
          startupProbe:
            httpGet: {path: /api/health, port: 3000}
            periodSeconds: 5
            failureThreshold: 180
          readinessProbe:
            httpGet: {path: /api/health, port: 3000}
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /api/health, port: 3000}
            initialDelaySeconds: 60
            periodSeconds: 10
          volumeMounts:
            - {name: datos, mountPath: /var/lib/grafana}
            - {name: provisioning, mountPath: /etc/grafana/provisioning/datasources/postgres.yaml, subPath: postgres.yaml}
            - {name: provisioning, mountPath: /etc/grafana/provisioning/dashboards/solarbi.yaml, subPath: solarbi.yaml}
            - {name: provisioning, mountPath: /etc/grafana/provisioning/alerting/alertas.yaml, subPath: alertas.yaml}
            - {name: provisioning, mountPath: /var/lib/grafana/dashboards/solarbi.json, subPath: tablero.json}
      volumes:
        - name: datos
          persistentVolumeClaim: {claimName: grafana}
        - name: provisioning
          configMap: {name: solarbi-grafana}
