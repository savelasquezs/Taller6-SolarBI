---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana
  namespace: solarbi
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: solarbi-local
  volumeName: solarbi-grafana
  resources:
