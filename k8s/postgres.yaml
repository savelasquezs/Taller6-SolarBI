apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: solarbi
spec:
  serviceName: db
  replicas: 1
  selector:
    matchLabels:
      app: solarbi-db
  template:
    metadata:
      labels:
        app: solarbi-db
    spec:
      containers:
        - name: postgres
          image: postgres:17.6
          envFrom:
            - configMapRef:
                name: solarbi-config
            - secretRef:
                name: solarbi-credenciales
          ports:
            - containerPort: 5432
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: '2', memory: 1Gi}
          readinessProbe:
            exec:
              command: [pg_isready, -U, solarbi, -d, solarbi]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: [pg_isready, -U, solarbi, -d, solarbi]
            initialDelaySeconds: 60
            periodSeconds: 10
          volumeMounts:
            - name: datos
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: datos
          persistentVolumeClaim:
            claimName: postgres
