name: SolarBI CI
on: [push, pull_request]
jobs:
  pruebas:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_DB: solarbi_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d solarbi_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      POSTGRES_DB: solarbi_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      BI_PASSWORD: lectura_solo_ci
      SIM_PASSWORD: simulador_solo_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements.txt pytest==9.2.0
      - run: python -m pytest tests -q
      - run: docker build --provenance=false -t solarbi-app:ci .
